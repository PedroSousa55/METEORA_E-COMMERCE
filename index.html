<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="style/style.css" />
    <link
    rel="shortcut icon"
    href="assets/Favicon-64px.png"
    type="image/x-icon"
    />
    <title>METEORA</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-md bg-dark navbar-dark px-3">
        <div class="container-fluid">
          
          <a class="navbar-brand" href="#">
            <img src="assets/Desktop/Logo%20desktop.png" alt="Meteora" class="d-none d-md-block" />
            <img src="assets/Mobile/Logo%20mobile.png" alt="Meteora" class="d-block d-md-none" />
          </a>
          
          
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacao" aria-controls="menuNavegacao" aria-expanded="false" aria-label="Abrir navegação">
            <span class="navbar-toggler-icon"></span>
          </button>

         
          <div class="collapse navbar-collapse" id="menuNavegacao">
            <ul class="navbar-nav me-auto mb-2 mb-md-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Lojas</a>
              </li>
              <li class="nav-item dropdown">
          <a class="nav-link dropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Novidades
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Coleção Verão</a></li>
            <li><a class="dropdown-item" href="#">Coleção Inverno</a></li>
            <li><a class="dropdown-item" href="#">Coleção Outono</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Em Alta</a></li>
          </ul>
        </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Promoções</a>
              </li>
            </ul>
            
            <form class="d-flex" role="search">
              <input class="form-control me-2 rounded-0" type="search" placeholder="Digite o produto" aria-label="Buscar">
              <button class="btn btn-outline-light rounded-0" type="submit">Buscar</button>
            </form>
          </div>
        </div>
      </nav>

      
      <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>
  <div class="carousel-inner">
    <!-- Slide 1 -->
    <div class="carousel-item active">
      <img src="assets/Desktop/Banner1.png" class="d-block w-100" alt="Banner 1">
    </div>
    <!-- Slide 2 -->
    <div class="carousel-item">
      <img src="assets/Desktop/Banner2.png" class="d-block w-100" alt="Banner 2">
      <div class="carousel-caption d-none d-md-block text-light" style="bottom: auto; top: 50%; transform: translateY(-50%);">
        <h2 class="fw-bold display-5">COLEÇÃO ATEMPORAL</h2>
        <p class="fs-4">Estilo e qualidade para durar.</p>
      </div>
    </div>
    <!-- Slide 3 -->
    <div class="carousel-item">
      <img src="assets/Desktop/Banner3.png" class="d-block w-100" alt="Banner 3">
      <div class="carousel-caption d-none d-md-block text-light" style="bottom: auto; top: 50%; transform: translateY(-50%);">
        <h2 class="fw-bold display-5">COLEÇÃO ATEMPORAL</h2>
        <p class="fs-4">Alto impacto visual, baixo impacto ambiental!</p>
      </div>
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
  </div>
    </header>

  </body>
